name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ runner.temp }}\nuget-packages
  BUILD_OUTPUT: src\SE_HardwareInserter.AddIn\bin\x64\Release\net48
  INNO_DIRECTORY: ${{ runner.temp }}\inno-setup-6.7.3
  ACCEPTANCE_CANDIDATE: ${{ runner.temp }}\solid-edge-acceptance-candidate

jobs:
  build-test:
    name: Core tests and add-in x64
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache immutable NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}

      - name: Validate PowerShell syntax
        shell: pwsh
        run: .\.github\scripts\Test-PowerShellSyntax.ps1

      - name: Validate registration and installer contract
        shell: pwsh
        run: .\dev\test-registration-contract.ps1

      - name: Restore dependencies
        run: dotnet restore SE_HardwareInserter.slnx --locked-mode

      - name: Run Core tests
        run: dotnet test tests\SE_HardwareInserter.Core.Tests\SE_HardwareInserter.Core.Tests.csproj -c Release --no-restore

      - name: Build add-in x64
        run: dotnet build src\SE_HardwareInserter.AddIn\SE_HardwareInserter.AddIn.csproj -c Release -p:Platform=x64 --no-restore

      - name: Validate explicit build payload
        shell: pwsh
        run: .\.github\scripts\Test-BuildPayload.ps1 -BuildOutput $env:BUILD_OUTPUT

      - name: Install verified portable Inno Setup 6.7.3
        id: inno
        shell: pwsh
        run: |
          $iscc = .\.github\scripts\Install-InnoSetup.ps1 -InstallDirectory $env:INNO_DIRECTORY
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile unsigned installer smoke
        shell: pwsh
        run: |
          $buildOutput = (Resolve-Path -LiteralPath $env:BUILD_OUTPUT).Path
          & '${{ steps.inno.outputs.iscc }}' '/DMyAppVersion=1.0.0' "/DBuildOutputDir=$buildOutput" 'installer\SE_HardwareInserter.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC devolvió $LASTEXITCODE." }
          $installer = 'installer\Output\SE_HardwareInserterSetup-1.0.0.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or
              (Get-Item -LiteralPath $installer).Length -le 0) {
            throw "El smoke de empaquetado no produjo '$installer'."
          }

      - name: Stage unsigned Solid Edge acceptance candidate
        shell: pwsh
        run: |
          [IO.Directory]::CreateDirectory($env:ACCEPTANCE_CANDIDATE) | Out-Null
          [IO.File]::Copy(
            (Resolve-Path -LiteralPath 'installer\Output\SE_HardwareInserterSetup-1.0.0.exe').Path,
            (Join-Path $env:ACCEPTANCE_CANDIDATE 'SE_HardwareInserterSetup-1.0.0.exe'),
            $false)
          [IO.File]::WriteAllText(
            (Join-Path $env:ACCEPTANCE_CANDIDATE 'source-commit.txt'),
            $env:GITHUB_SHA + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false))

      - name: Upload unsigned acceptance candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solid-edge-acceptance-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.ACCEPTANCE_CANDIDATE }}
