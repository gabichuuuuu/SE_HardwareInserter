name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-2025
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET
        # actions/setup-dotnet v5.4.0
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        # github/codeql-action v4.36.0
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          languages: csharp
          build-mode: manual

      - name: Restore dependencies
        run: dotnet restore SE_HardwareInserter.slnx --locked-mode

      - name: Build add-in (Release x64)
        run: dotnet build src/SE_HardwareInserter.AddIn/SE_HardwareInserter.AddIn.csproj -c Release -p:Platform=x64 --no-restore

      - name: Analyze
        # github/codeql-action v4.36.0
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
