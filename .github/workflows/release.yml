name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Build and test unsigned payload
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.version.outputs.installer }}
      sbom: ${{ steps.version.outputs.sbom }}
      checksums: ${{ steps.version.outputs.checksums }}
    env:
      BUILD_OUTPUT: src\SE_HardwareInserter.AddIn\bin\x64\Release\net48
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # El contexto runner no existe en el env del job: las rutas temporales se fijan aquí.
      - name: Set runner temp paths
        shell: pwsh
        run: |
          "STAGE_DIRECTORY=$env:RUNNER_TEMP\se-hardware-inserter-stage" >> $env:GITHUB_ENV
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require exclusive Solid Edge 2022-2026 evidence commit
        shell: pwsh
        run: |
          $sourceCommit = (& git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'El commit de evidencias no tiene un padre válido.'
          }
          $expected = @(2022..2026 | ForEach-Object { "validation/solid-edge/SE$_.json" })
          $changed = @(& git diff --name-only HEAD^ HEAD -- | Sort-Object)
          if (($changed -join [char]10) -ne (($expected | Sort-Object) -join [char]10)) {
            throw "HEAD^..HEAD debe contener solo las cinco evidencias: $($changed -join ', ')."
          }
          .\.github\scripts\Test-SolidEdgeValidationMatrix.ps1 -ValidationDirectory 'validation\solid-edge' -ExpectedCommit $sourceCommit
      - name: Setup project .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Validate PowerShell and registration contract
        shell: pwsh
        run: |
          .\.github\scripts\Test-PowerShellSyntax.ps1
          .\dev\test-registration-contract.ps1
      - name: Validate and derive release version
        id: version
        shell: pwsh
        run: |
          $version = .\.github\scripts\Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=SE_HardwareInserterSetup-$version.exe" >> $env:GITHUB_OUTPUT
          "sbom=SE_HardwareInserter-$version.spdx.json" >> $env:GITHUB_OUTPUT
          "checksums=SE_HardwareInserter-$version.sha256" >> $env:GITHUB_OUTPUT
      - name: Restore dependencies
        run: dotnet restore SE_HardwareInserter.slnx --locked-mode
      - name: Run Core tests
        run: dotnet test tests\SE_HardwareInserter.Core.Tests\SE_HardwareInserter.Core.Tests.csproj -c Release --no-restore
      - name: Build versioned add-in x64
        shell: pwsh
        run: >-
          dotnet build src\SE_HardwareInserter.AddIn\SE_HardwareInserter.AddIn.csproj
          -c Release -p:Platform=x64 --no-restore
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.version }}
      - name: Stage explicit unsigned payload
        shell: pwsh
        run: >-
          .\.github\scripts\Stage-ReleasePayload.ps1
          -BuildOutput $env:BUILD_OUTPUT
          -StageDirectory $env:STAGE_DIRECTORY
          -Version ${{ steps.version.outputs.version }}
      - name: Stage restored build metadata for SBOM
        shell: pwsh
        run: >-
          .\.github\scripts\Stage-BuildMetadata.ps1
          -RepositoryRoot $PWD
          -StageDirectory $env:STAGE_DIRECTORY
      - name: Upload unsigned payload for isolated signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-payload-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.STAGE_DIRECTORY }}

  sign-package:
    name: Sign, package and smoke
    needs: build-test
    runs-on: windows-2025
    timeout-minutes: 35
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build-test.outputs.version }}
      INSTALLER_NAME: ${{ needs.build-test.outputs.installer }}
      SBOM_NAME: ${{ needs.build-test.outputs.sbom }}
      CHECKSUMS_NAME: ${{ needs.build-test.outputs.checksums }}
      SIGNING_EXPECTED_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
    # Environment secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
    # Environment variables: AZURE_ARTIFACT_SIGNING_ENDPOINT,
    # AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME, AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME,
    # AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT (full DN or one complete DN component such as CN=...).
    steps:
      - name: Set runner temp paths
        shell: pwsh
        run: |
          "STAGE_DIRECTORY=$env:RUNNER_TEMP\se-hardware-inserter-stage" >> $env:GITHUB_ENV
          "RELEASE_DIRECTORY=$env:RUNNER_TEMP\se-hardware-inserter-release" >> $env:GITHUB_ENV
          "INNO_DIRECTORY=$env:RUNNER_TEMP\inno-setup-6.7.3" >> $env:GITHUB_ENV
          "SBOM_TOOL_DIRECTORY=$env:RUNNER_TEMP\sbom-tool" >> $env:GITHUB_ENV
          "SBOM_INPUT_DIRECTORY=$env:RUNNER_TEMP\se-hardware-inserter-sbom-input" >> $env:GITHUB_ENV
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup project .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Download unsigned payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-payload-${{ env.VERSION }}
          path: ${{ env.STAGE_DIRECTORY }}
      - name: Validate transferred payload
        shell: pwsh
        run: .\.github\scripts\Test-BuildPayload.ps1 -BuildOutput $env:STAGE_DIRECTORY -Version $env:VERSION
      - name: Record Interop hash before signing
        id: interop
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "$env:STAGE_DIRECTORY\Interop.SolidEdge.dll" -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Azure login with OIDC
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign project DLLs with Azure Artifact Signing
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ env.STAGE_DIRECTORY }}\SE_HardwareInserter.AddIn.dll
            ${{ env.STAGE_DIRECTORY }}\SE_HardwareInserter.Core.dll
            ${{ env.STAGE_DIRECTORY }}\SE_HardwareInserter.SolidEdge.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
      - name: Verify DLL signatures and unchanged Interop
        shell: pwsh
        run: |
          $ownDlls = @(
            "$env:STAGE_DIRECTORY\SE_HardwareInserter.AddIn.dll",
            "$env:STAGE_DIRECTORY\SE_HardwareInserter.Core.dll",
            "$env:STAGE_DIRECTORY\SE_HardwareInserter.SolidEdge.dll"
          )
          .\.github\scripts\Assert-Authenticode.ps1 -Path $ownDlls -ExpectedSubject $env:SIGNING_EXPECTED_SUBJECT
          .\.github\scripts\Assert-SignTool.ps1 -Path $ownDlls
          $interopHash = (Get-FileHash -LiteralPath "$env:STAGE_DIRECTORY\Interop.SolidEdge.dll" -Algorithm SHA256).Hash
          if ($interopHash -ne '${{ steps.interop.outputs.sha256 }}') {
            throw 'Interop.SolidEdge.dll fue modificado durante la firma.'
          }
      - name: Install verified portable Inno Setup 6.7.3
        id: inno
        shell: pwsh
        run: |
          $iscc = .\.github\scripts\Install-InnoSetup.ps1 -InstallDirectory $env:INNO_DIRECTORY
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
      - name: Compile installer from signed payload
        shell: pwsh
        run: |
          & '${{ steps.inno.outputs.iscc }}' "/DMyAppVersion=$env:VERSION" "/DBuildOutputDir=$env:STAGE_DIRECTORY" 'installer\SE_HardwareInserter.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC devolvió $LASTEXITCODE." }
          [IO.Directory]::CreateDirectory($env:RELEASE_DIRECTORY) | Out-Null
          [IO.File]::Copy((Join-Path $PWD "installer\Output\$env:INSTALLER_NAME"), (Join-Path $env:RELEASE_DIRECTORY $env:INSTALLER_NAME), $false)
      - name: Sign installer with Azure Artifact Signing
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ env.RELEASE_DIRECTORY }}\${{ env.INSTALLER_NAME }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
      - name: Verify installer signature
        shell: pwsh
        run: |
          $installer = Join-Path $env:RELEASE_DIRECTORY $env:INSTALLER_NAME
          .\.github\scripts\Assert-Authenticode.ps1 -Path $installer -ExpectedSubject $env:SIGNING_EXPECTED_SUBJECT
          .\.github\scripts\Assert-SignTool.ps1 -Path $installer
      - name: Smoke install and uninstall
        shell: pwsh
        run: |
          $installer = Join-Path $env:RELEASE_DIRECTORY $env:INSTALLER_NAME
          .\dev\smoke-install.ps1 -InstallerPath $installer
          .\dev\smoke-uninstall.ps1
      - name: Setup .NET 8 for pinned sbom-tool
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Microsoft sbom-tool
        shell: pwsh
        run: >-
          dotnet tool install Microsoft.Sbom.DotNetTool
          --version 4.1.5
          --tool-path $env:SBOM_TOOL_DIRECTORY
      - name: Generate and validate SPDX SBOM and SHA256
        shell: pwsh
        run: |
          $installer = Join-Path $env:RELEASE_DIRECTORY $env:INSTALLER_NAME
          $metadataArguments = @{
            SbomTool = "$env:SBOM_TOOL_DIRECTORY\sbom-tool.exe"
            ReleaseDirectory = $env:RELEASE_DIRECTORY
            SbomInputDirectory = $env:SBOM_INPUT_DIRECTORY
            PayloadDirectory = $env:STAGE_DIRECTORY
            BuildMetadataDirectory = "$env:STAGE_DIRECTORY\_build-metadata"
            InstallerPath = $installer
            Version = $env:VERSION
            Repository = '${{ github.repository }}'
          }
          .\.github\scripts\New-ReleaseMetadata.ps1 @metadataArguments
      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ env.VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.RELEASE_DIRECTORY }}\${{ env.INSTALLER_NAME }}
            ${{ env.RELEASE_DIRECTORY }}\${{ env.SBOM_NAME }}
            ${{ env.RELEASE_DIRECTORY }}\${{ env.CHECKSUMS_NAME }}

  publish:
    name: Publish immutable GitHub Release
    needs: [build-test, sign-package]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build-test.outputs.version }}
      INSTALLER_NAME: ${{ needs.build-test.outputs.installer }}
      SBOM_NAME: ${{ needs.build-test.outputs.sbom }}
      CHECKSUMS_NAME: ${{ needs.build-test.outputs.checksums }}
    steps:
      - name: Set runner temp paths
        shell: pwsh
        run: |
          "RELEASE_DIRECTORY=$env:RUNNER_TEMP\se-hardware-inserter-release" >> $env:GITHUB_ENV
      - name: Download signed release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ env.VERSION }}
          path: ${{ env.RELEASE_DIRECTORY }}
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Join-Path $env:RELEASE_DIRECTORY $env:INSTALLER_NAME),
            (Join-Path $env:RELEASE_DIRECTORY $env:SBOM_NAME),
            (Join-Path $env:RELEASE_DIRECTORY $env:CHECKSUMS_NAME)
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Falta el artefacto de publicación '$asset'."
            }
          }
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title "SE_HardwareInserter v$env:VERSION"
